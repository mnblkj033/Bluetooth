name: 构建 APK

# 每次推送到 main 分支时自动编译，也可以在 Actions 页面手动点「Run workflow」
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 编译并打包
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Gradle 8.9（自动缓存依赖）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 编译 release 版 APK
        run: gradle --no-daemon assembleRelease

      - name: 上传 APK（Actions 页面可下载）
        uses: actions/upload-artifact@v4
        with:
          name: btshare-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 发布到 Releases（手机点开就能下）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" app/build/outputs/apk/release/*.apk \
            --title "蓝牙投屏 ${TAG}" \
            --notes "自动构建产物，下载后直接安装即可。包名 com.mnblkj.btshare，最低支持 Android 8.0。" \
            --repo "$GITHUB_REPOSITORY"
